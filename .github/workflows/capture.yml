name: capture

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: binder setup
        run: |
          set -x
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs
          ls -la /dev/binderfs | head -8
          echo binder-ok

      - name: redroid image pull
        run: |
          echo "start $(date -u +%T)"
          timeout 480 sudo docker pull redroid/redroid:12.0.0-latest
          echo "pulled $(date -u +%T)"

      - name: redroid boot
        run: |
          set -x
          echo "boot start $(date -u +%T)"
          sudo docker run -d --privileged --name redroid             -v /dev/binderfs:/dev/binderfs             -p 5555:5555             redroid/redroid:12.0.0-latest             androidboot.redroid_gpu_mode=software
          sleep 20
          adb connect localhost:5555 || true
          BOOTED=0
          for i in $(seq 1 60); do
            st=$(adb -s localhost:5555 get-state 2>/dev/null || true)
            if [ "$st" = "device" ]; then
              ok=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '[:space:]' || true)
              if [ "$ok" = "1" ]; then BOOTED=1; echo "booted after $((i*5))s"; break; fi
            else
              adb connect localhost:5555 >/dev/null 2>&1 || true
            fi
            sleep 5
          done
          adb devices || true
          adb -s localhost:5555 shell getprop sys.boot_completed || true
          if [ "$BOOTED" != "1" ]; then sudo docker logs redroid 2>&1 | tail -60; exit 1; fi
          echo "boot done $(date -u +%T)"

      - name: download payload
        run: |
          curl -sL -o app.apk "https://github.com/silverou/arm-android-lab/releases/download/payload-v1/hepy_2.0.4.apk"
          ls -la app.apk
          sha256sum app.apk

      - name: install app
        run: |
          adb -s localhost:5555 install -r -g app.apk 2>&1 | tail -3
          adb -s localhost:5555 shell pm path com.ihuman.pinyin || true

      - name: plain launch probe
        run: |
          adb -s localhost:5555 logcat -c || true
          adb -s localhost:5555 shell am start -n com.ihuman.pinyin/org.cocos2dx.lua.AppActivity || true
          sleep 45
          echo "--- pid ---"
          adb -s localhost:5555 shell "pidof com.ihuman.pinyin && echo ALIVE || echo DEAD" || true
          echo "--- crash markers ---"
          adb -s localhost:5555 logcat -d -v time 2>/dev/null | grep -aE "0xdead|Fatal signal|x_initialize|MyApplication|ClassNotFound" | tail -20 || true
          adb -s localhost:5555 logcat -d -v time > logcat_plain.txt 2>/dev/null || true
          adb -s localhost:5555 shell am force-stop com.ihuman.pinyin || true

      - name: frida setup
        run: |
          curl -sL -o fs.xz "https://github.com/frida/frida/releases/download/17.24.3/frida-server-17.24.3-android-arm64.xz"
          xz -d fs.xz
          adb -s localhost:5555 push fs /data/local/tmp/frida-server
          adb -s localhost:5555 shell "chmod 755 /data/local/tmp/frida-server"
          adb -s localhost:5555 root || true
          sleep 3
          adb -s localhost:5555 shell "nohup /data/local/tmp/frida-server -D >/dev/null 2>&1 &" || true
          sleep 3
          adb -s localhost:5555 shell "ps -A | grep -a frida" || true
          adb -s localhost:5555 forward tcp:27042 tcp:27042 || true
          pip install -q frida==17.24.3

      - name: frida spawn capture
        run: |
          adb -s localhost:5555 shell am force-stop com.ihuman.pinyin || true
          timeout 240 python3 tools/run_capture.py 180 > hook_out.txt 2>&1 || true
          echo "===== hook_out ====="
          tail -80 hook_out.txt || true
          adb -s localhost:5555 logcat -d -v time > logcat_frida.txt 2>/dev/null || true
          echo "===== frida-run crash markers ====="
          grep -aE "0xdead|Fatal signal" logcat_frida.txt | tail -10 || true

      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-out
          path: |
            logcat_plain.txt
            logcat_frida.txt
            hook_out.txt
          if-no-files-found: warn

      - name: cleanup
        if: always()
        run: sudo docker rm -f redroid 2>/dev/null || true
